project:
  type: book
  output-dir: _book

book:
  title: "Seenevõrgustiku katkestamise ja naabertaimede tüübi mõju krohmseente kolonisatsioonile"
  subtitle: "Magistritöö"
  output-file: DistNet_thesis
  author: 
    - name: "Mare Hunt"
    - name: "Juhendaja: Kadri Koorem"
      affiliation: 
      - name: "Tartu Ülikool"
      - name: "Ökoloogia ja Maateaduste Instituut"
      - name: "Botaanika osakond"
  date: today
  date-format: "D. MMMM YYYY"
  chapters:
    - skeleton.qmd
    - index.qmd
    - 01-sissejuhatus.qmd
    - 02-metoodika.qmd
    - 03-tulemused.qmd
    - 04-arutelu.qmd
    - 05-kokkuvote.qmd
    - references.qmd

lang: et
toc-title: Sisukord
bibliography: references.bib
# csl: <ülikooli nõutav .csl fail>  # vaikimisi Chicago author-date

crossref:
  fig-title: Joonis
  tbl-title: Tabel
  fig-prefix: joonis
  tbl-prefix: tabel

execute:
  echo: false
  warning: false
  message: false
  freeze: true  # freeze: auto ignores changes in {{< include >}} files -> stale output

format:
  html:
    toc: true
    include-in-header:
      text: <meta name="robots" content="noindex">
  docx:
    toc: true
    number-sections: true
    # reference-doc: reference.docx  # lisa, kui vormingufail on olemas
