project:
  type: book
  output-dir: _book

book:
  title: "Seenevõrgustiku katkestamise ja naabertaimede tüübi mõju krohmseente kolonisatsioonile"
  subtitle: "Magistritöö"
  output-file: DistNet_thesis
  author: 
    - name: "Mare Hunt"
    - name: "Juhendaja: Kadri Koorem"
      affiliation: 
      - name: "Tartu Ülikool"
      - name: "Ökoloogia ja Maateaduste Instituut"
      - name: "Botaanika osakond"
  date: today
  date-format: "D. MMMM YYYY"
  sidebar:
    tools:
      - icon: github
        href: https://github.com/kokakoola/DistNet
        text: "Projekti kood"
      - icon: file-earmark-word
        href: https://tartuulikool.sharepoint.com/sites/PRG1836-Mare/Shared%20Documents/Forms/AllItems.aspx?id=%2Fsites%2FPRG1836%2DMare%2FShared%20Documents%2FMare%2FMasterThesis%2FDocs%2FReview
        text: ".docx (OneDrive)"
      - icon: file-earmark-excel
        href: https://tartuulikool.sharepoint.com/sites/PRG1836-Mare/Shared%20Documents/Forms/AllItems.aspx?id=%2Fsites%2FPRG1836%2DMare%2FShared%20Documents%2FMare%2FMasterThesis%2FRawData%2FFieldwork
        text: "Andmetabelid (OneDrive)"
  chapters:
    - skeleton.qmd
    - index.qmd
    - 01-sissejuhatus.qmd
    - 02-metoodika.qmd
    - 03-tulemused.qmd
    - 04-arutelu.qmd
    - 05-kokkuvote.qmd
    - references.qmd

lang: et
toc-title: Sisukord
bibliography: references.bib
# csl: <ülikooli nõutav .csl fail>  # vaikimisi Chicago author-date

crossref:
  fig-title: Joonis
  tbl-title: Tabel
  fig-prefix: joonis
  tbl-prefix: tabel

execute:
  echo: false
  warning: false
  message: false
  freeze: false  # auto/true reuse old results when only an include file changed

format:
  html:
    toc: true
    include-in-header:
      text: |
        <meta name="robots" content="noindex">
        <style>
          /* sidebar links (see script below): one per line, underline on hover */
          .sidebar-header + .sidebar-tools-main { display: flex; flex-direction: column; align-items: flex-start; gap: 0.2rem; }
          .sidebar-header + .sidebar-tools-main a.quarto-navigation-tool { padding-left: 0 !important; text-decoration: none; }
          .sidebar-header + .sidebar-tools-main a.quarto-navigation-tool:hover { text-decoration: underline; }
        </style>
    # sidebar links (GitHub, SharePoint) with text labels, one per line above the search box
    include-after-body:
      text: |
        <script>
        document.addEventListener("DOMContentLoaded", () => {
          const tools = document.querySelector(".sidebar-tools-main");
          const search = document.querySelector(".sidebar-search");
          if (!tools || !search) return;
          tools.classList.add("mt-2");
          tools.querySelectorAll("a.quarto-navigation-tool").forEach(a => {
            a.insertAdjacentText("beforeend", " " + a.title);
          });
          document.querySelector(".sidebar-header").after(tools);
        });
        </script>
  docx:
    toc: true
    filters:
      - docx-callouts.lua  # callouts as plain text: Word Online rejects callout tables
    number-sections: true
    # reference-doc: reference.docx  # lisa, kui vormingufail on olemas
